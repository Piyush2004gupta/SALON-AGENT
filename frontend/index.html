<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeGlow Salon Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Left Side: Branding -->
        <aside class="branding-panel">
            <div class="brand-content">
                <h1 class="logo">LuxeGlow<span>.</span></h1>
                <p class="tagline">Your personal AI styling assistant.</p>
                <div class="features">
                    <div class="feature-item">✨ Hair Styling</div>
                    <div class="feature-item">💅 Manicures & Pedicures</div>
                    <div class="feature-item">💆‍♀️ Spa & Relax</div>
                </div>
            </div>
        </aside>

        <!-- Right Side: Chatbox -->
        <main class="chat-panel">
            <header class="chat-header">
                <h2>Salon Assistant</h2>
                <span class="status-indicator"></span>
            </header>
            
            <div class="chat-history" id="chat-history">
                <div class="message ai-message">
                    <div class="avatar">✨</div>
                    <div class="bubble">Hello! I am your LuxeGlow assistant. How can I help you today?</div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off" />
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </main>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
